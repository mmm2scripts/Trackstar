<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080d">
<title>Booga Track</title>
<link rel="icon" href="/icon-mojo.png">
<script>try{var t=localStorage.getItem('bb_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{color-scheme:dark;--bg:#08080d;--side:rgba(12,12,19,.72);--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.085);--bd:rgba(255,255,255,.09);--fg:#f4f4f8;--mute:#9a9ab0;--dim:#66667e;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;--mojo:#a78bfa;--candy:#fbbf24;--inv:#5eead4;--acc:#8b5cf6;--acc2:#f97316;--grid:rgba(255,255,255,.07);--r:16px;--shadow:0 12px 36px rgba(0,0,0,.4);--glow1:rgba(124,58,237,.26);--glow2:rgba(249,115,22,.16)}
[data-theme=light]{color-scheme:light;--bg:#f3f3f9;--side:rgba(255,255,255,.8);--card:#fff;--card2:#ececf5;--bd:rgba(20,20,45,.1);--fg:#14141f;--mute:#5b5b72;--dim:#9a9ab2;--ok:#059669;--bad:#e11d48;--warn:#b45309;--mojo:#7c3aed;--candy:#d97706;--inv:#0d9488;--grid:rgba(20,20,45,.08);--shadow:0 10px 28px rgba(30,30,70,.1);--glow1:rgba(124,58,237,.12);--glow2:rgba(249,115,22,.09)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--card2);padding:2px 6px;border-radius:6px;word-break:break-all}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 520px at 6% -12%,var(--glow1),transparent 60%),radial-gradient(800px 520px at 100% 112%,var(--glow2),transparent 60%),var(--bg)}
.app{display:flex;min-height:100vh}
aside{width:252px;flex:none;position:sticky;top:0;height:100vh;padding:20px 14px 16px;display:flex;flex-direction:column;border-right:1px solid var(--bd);background:var(--side);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.logo{display:flex;align-items:center;gap:12px;padding:0 8px 20px}
.logo .mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(124,58,237,.5),rgba(249,115,22,.4));border:1px solid var(--bd)}
.logo .mark img{width:25px;height:25px;object-fit:contain}
.logo b{display:block;font-size:16px;letter-spacing:-.2px}
.logo small{color:var(--mute);font-size:10.5px;letter-spacing:2px;text-transform:uppercase}
.grp{font-size:10.5px;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase;padding:14px 12px 6px}
nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:12px;color:var(--mute);font-weight:550;font-size:14px;text-align:left;transition:.15s;position:relative}
nav button:hover{background:var(--card);color:var(--fg)}
nav button.active{background:var(--card2);color:var(--fg)}
nav button.active::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(var(--a1),var(--a2))}
nav .ic{width:20px;height:20px;display:grid;place-items:center;flex:none}
nav .ic svg,nav .ic img{width:19px;height:19px;object-fit:contain}
nav .tag{margin-left:auto;font-size:11.5px;background:var(--card2);color:var(--mute);padding:2px 8px;border-radius:99px}
.side-bot{margin-top:auto;display:grid;gap:10px}
.conn{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;background:var(--card);border:1px solid var(--bd);font-size:13px;cursor:pointer;text-align:left;width:100%}
.conn:hover{background:var(--card2)}
.conn small{display:block;color:var(--mute);font-size:11.5px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none;position:relative}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.dot.ok::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);opacity:0;animation:ping 2.4s infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.4);opacity:0}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn svg{width:16px;height:16px}
.btn.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--bd)}
.btn.ghost:hover{filter:none;background:var(--card);border-color:var(--mute)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.red{color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
main{flex:1;min-width:0;padding:26px 32px 60px;max-width:1380px;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:27px;letter-spacing:-.6px}
.top .sub{color:var(--mute);margin-top:3px;font-size:14px}
.tools{display:flex;gap:8px;align-items:center}
.live{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:12.5px;color:var(--mute);white-space:nowrap}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--bd);color:var(--mute);transition:.15s}
.ibtn:hover{color:var(--fg);background:var(--card2)}
.ibtn svg{width:18px;height:18px}
.ibtn.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.banner{display:none;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:14px;margin-bottom:18px;background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.35)}
.banner.show{display:flex}
.banner.info{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.35)}
.banner b{display:block;margin-bottom:2px}
.banner p{color:var(--mute);font-size:13.5px}
.banner .acts{margin-left:auto;display:flex;gap:8px;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px;min-width:0}
.card h3{font-size:14.5px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;font-weight:650}
.card h3 .btn{margin-left:auto}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.split{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-bottom:14px}
.stat{position:relative;overflow:hidden;padding:18px 18px 14px}
.stat .l{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12.5px;font-weight:550}
.stat .l img,.stat .l svg{width:18px;height:18px;object-fit:contain}
.stat .v{display:block;font-size:30px;font-weight:750;letter-spacing:-1px;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.stat .d{font-size:12.5px;color:var(--mute)}
.stat .d b{color:var(--ok);font-weight:650}
.stat .spark{position:absolute;right:0;bottom:0;width:40%;height:46px;opacity:.9;pointer-events:none}
.pills{display:inline-flex;background:var(--card2);border-radius:11px;padding:3px;gap:2px}
.pills button{padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--mute)}
.pills button.active{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.chead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.chead .big{font-size:32px;font-weight:760;letter-spacing:-1px;font-variant-numeric:tabular-nums;color:var(--c)}
.chead .lbl{display:block;color:var(--mute);font-size:12.5px}
.chead .rate{color:var(--mute);font-size:12.5px;text-align:right}
.chead .rate b{color:var(--fg)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--dim);font-size:12.5px}
.chart .tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,calc(-100% - 12px));background:var(--bg);border:1px solid var(--bd);box-shadow:var(--shadow);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--mute);white-space:nowrap;transition:opacity .1s;z-index:2}
.chart .tip b{display:block;color:var(--fg);font-size:13.5px}
.lb{display:grid;gap:4px}
.lrow{display:grid;grid-template-columns:40px minmax(110px,1.3fr) minmax(70px,1.6fr) auto auto;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;cursor:pointer;transition:.12s}
.lrow:hover{background:var(--card2)}
.lrow.off{opacity:.55}
.lrow.ov{grid-template-columns:40px minmax(110px,1.3fr) 1fr 1fr}
.nm b{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--mute);font-size:12px;display:flex;align-items:center;gap:6px}
.lvl{font-size:10.5px;font-weight:700;color:var(--mute);background:var(--card2);padding:1px 6px;border-radius:6px}
.bar{height:7px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c),var(--c2,var(--c)));transition:width .6s}
.val{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:62px}
.gain{font-size:12px;font-weight:650;color:var(--ok);background:rgba(52,211,153,.12);padding:3px 8px;border-radius:99px;white-space:nowrap}
.gain.zero{color:var(--mute);background:var(--card2)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:750;font-size:15px;color:#fff;position:relative;flex:none}
.av i{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--dim);border:2px solid var(--bg)}
.av i.on{background:var(--ok)}
.badge{font-size:11px;font-weight:650;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mute)}
.badge.ok{background:rgba(52,211,153,.14);color:var(--ok)}
.badge.warn{background:rgba(251,191,36,.14);color:var(--warn)}
.empty{padding:34px 14px;text-align:center;color:var(--mute);font-size:14px}
.empty b{color:var(--fg)}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 6px}
.minis>div{background:var(--card2);border-radius:12px;padding:10px 13px}
.minis small{display:block;color:var(--mute);font-size:11.5px}
.minis b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tool{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.fld,select{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 13px;outline:none;transition:.15s;min-width:0}
.fld:focus,select:focus{border-color:var(--acc)}
.fld{flex:1;min-width:180px}
select option{background:var(--bg);color:var(--fg)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px}
.seg button{padding:7px 13px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.active{background:var(--card2);color:var(--fg)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);text-align:left;padding:10px 12px;font-weight:650;white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--bd);white-space:nowrap}
tbody tr{cursor:pointer;transition:.12s}
tbody tr:hover{background:var(--card2)}
.r{text-align:right;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warnc{color:var(--warn)}
.who{display:flex;align-items:center;gap:11px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:6px}
.item:hover{transform:translateY(-3px);border-color:var(--inv);box-shadow:var(--shadow)}
.item .ico{width:64px;height:64px;border-radius:14px;background:var(--card2);display:grid;place-items:center;overflow:hidden}
.item .ico img{width:100%;height:100%;object-fit:cover}
.ph{font-weight:750;font-size:22px;color:var(--mute)}
.item .n{font-weight:650;font-size:13.5px;line-height:1.2;word-break:break-word}
.item .q{font-weight:750;color:var(--inv);font-variant-numeric:tabular-nums}
.item .chips{font-size:11px;color:var(--mute)}
.set{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.set .wide{grid-column:1/-1}
.set p{color:var(--mute);font-size:13.5px;margin-bottom:12px}
.line{display:flex;gap:8px;flex-wrap:wrap}
.box{display:block;padding:12px 13px;border-radius:12px;background:var(--card2);margin-bottom:10px;font-size:12.5px;line-height:1.5}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--bd)}
.opt:first-of-type{border-top:0}
.opt small{display:block;color:var(--mute);font-size:12.5px}
.sw{position:relative;width:44px;height:25px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--card2);border:1px solid var(--bd);transition:.2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:var(--mute);transition:.2s}
.sw input:checked+i{background:var(--acc);border-color:var(--acc)}
.sw input:checked+i::after{left:22px;background:#fff}
.steps{display:grid;gap:2px}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:11px 4px;border-top:1px solid var(--bd)}
.step:first-child{border-top:0}
.step .si{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;background:var(--card2);color:var(--mute)}
.step.ok .si{background:rgba(52,211,153,.18);color:var(--ok)}
.step.bad .si{background:rgba(251,113,133,.18);color:var(--bad)}
.step.warn .si{background:rgba(251,191,36,.18);color:var(--warn)}
.step.ok,.step.bad,.step.warn{color:var(--fg)}
.step b{font-size:14px}
.step p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.step .fix{color:var(--fg);margin-top:5px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.2s;z-index:50}
.shade.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);border-left:1px solid var(--bd);box-shadow:var(--shadow);transform:translateX(104%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:51;overflow-y:auto;padding:22px}
.drawer.show{transform:none}
.dh{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.dh .av{width:50px;height:50px;font-size:20px;border-radius:15px}
.dh h2{font-size:20px;letter-spacing:-.3px}
.dh .x{margin-left:auto}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.dgrid>div{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:12px 14px}
.dgrid small{color:var(--mute);font-size:12px;display:flex;align-items:center;gap:6px}
.dgrid small img{width:15px;height:15px}
.dgrid b{font-size:20px;font-variant-numeric:tabular-nums}
.dgrid em{font-style:normal;font-size:12px;color:var(--ok);font-weight:650}
.dsec{margin-bottom:18px}
.dsec h4{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.hrow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--bd);font-size:14px;cursor:pointer}
.hrow:first-of-type{border-top:0}
.sk{background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px;min-height:16px}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,24px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mnav{display:none}
@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.split,.two{grid-template-columns:1fr}.set{grid-template-columns:1fr}}
@media(max-width:820px){
  aside{display:none}
  main{padding:18px 14px 96px}
  .top h1{font-size:23px}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--side);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px}
  .mnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;color:var(--mute);font-size:10.5px;font-weight:600}
  .mnav button.active{background:var(--card2);color:var(--fg)}
  .mnav svg,.mnav img{width:21px;height:21px;object-fit:contain}
  .lrow{grid-template-columns:40px 1fr auto;gap:10px}
  .lrow .bar,.lrow .gain{display:none}
  .minis{grid-template-columns:1fr 1fr}
  .stat .v{font-size:25px}
  .stat .spark{display:none}
  .lrow.ov{grid-template-columns:40px minmax(0,1fr) auto auto;gap:8px}
  .lrow.ov .val{min-width:0;font-size:13px}
  .lrow.ov .u{display:none}
  .chead .big{font-size:27px}
  .banner{flex-direction:column}.banner .acts{margin-left:0}
  .hide-m{display:none}
}
@media(max-width:480px){.grid4{gap:10px}.stat{padding:14px 14px 12px}.items{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="app">
  <aside>
    <div class="logo"><div class="mark"><img src="/icon-mojo.png" alt=""></div><div><b>Booga Booga</b><small>Track</small></div></div>
    <nav id="nav"></nav>
    <div class="side-bot">
      <button class="conn" id="connBtn" title="Open connection check"><span class="dot" id="sdot"></span><span><span id="stxt">Connecting...</span><small id="ssub">&nbsp;</small></span></button>
      <button class="btn" id="copyLoader"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>Copy loader</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<nav class="mnav" id="mnav"></nav>
<div class="shade" id="shade"></div>
<div class="drawer" id="drawer" aria-hidden="true"></div>
<div class="toast" id="toast"></div>

<script>
window.__CFG__ = /*CFG*/{};
(function(){
'use strict';
const CFG = window.__CFG__ || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = { get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, del:k=>{try{localStorage.removeItem(k)}catch(e){}} };

const state = {
  tab: ls.get('bb_tab','overview'), key: ls.get('bb_key',''), apiBase: ls.get('bb_api','').replace(/\/+$/,''),
  range: +ls.get('bb_range','60'), accounts: [], chartUser: 'all', invUser: 'all', invQ: '', invSort: 'qty',
  q: '', filter: 'all', sort: 'status', hideOffline: ls.get('bb_hide','0')==='1', compact: ls.get('bb_compact','0')==='1',

function fmt(n){ if (n == null || isNaN(n)) return '—'; n = Math.round(n);

  return n.toLocaleString('en-US'); }
function fmtShort(v){ const c = state.compact; state.compact = true; const s = fmt(v); state.compact = c; return s; }
function ago(ms){ if(!ms) return 'never'; const s=Math.max(0,(Date.now()-ms)/1000|0); if(s<10) return 'just now'; if(s<60) return s+'s ago'; if(s<3600) return (s/60|0)+'m ago'; if(s<86400) return (s/3600|0)+'h ago'; return (s/86400|0)+'d ago'; }

function setNum(sel, v, f){ const el = typeof sel==='string'?$(sel):sel; if(!el) return; f = f || fmt; v = v || 0;
  const from = el.dataset.v === undefined ? v : +el.dataset.v; el.dataset.v = v;

/* ---------- api ---------- */
function mkErr(kind, detail, hint){ const e = new Error(kind); e.kind = kind; e.detail = detail; e.hint = hint; return e; }
async function api(path, opts={}){
  const t0 = performance.now(); let r;
  try { r = await fetch(API_BASE() + path, Object.assign({ cache:'no-store' }, opts, { headers: Object.assign({'x-key': state.key}, opts.headers||{}) })); }
  catch (e) { throw mkErr('network', state.apiBase ? `Your browser could not reach ${state.apiBase}. In direct mode the API must be https (or this page must be http) and allow CORS.` : 'Could not reach the dashboard server. Check your internet connection.'); }
  state.ms = Math.round(performance.now() - t0);
  let body = null; if ((r.headers.get('content-type')||'').includes('json')) { try { body = await r.json(); } catch(e) {} }
  if (r.status === 401 && body && body.error === 'bad key') throw mkErr('auth');
  if (!r.ok) {
    if (body && (body.error === 'unreachable' || body.error === 'config')) throw mkErr(body.error, body.detail, body.hint);
    throw mkErr('http', `The API answered HTTP ${r.status}.`, 'Check that API_URL points at the Booga Track API and that it is running.');
  }
  if (body == null) throw mkErr('http', 'The server answered, but not with API data.', 'API_URL probably points at the wrong server. It should be the address printed by the API on start-up.');
  return body;
}

/* ---------- charts ---------- */
function niceCeil(m){ const p = Math.pow(10, Math.floor(Math.log10(m))); for (const k of [1,2,2.5,5,10]) if (m <= k*p) return k*p; return 10*p; }
function chart(el, buckets, color, unit, id){
  if (typeof el === 'string') el = $(el); if (!el || !buckets || buckets.length < 2) return;
  const sig = buckets.map(b => b.earned).join(',') + color + state.range + state.compact + document.documentElement.dataset.theme;
  if (el._sig === sig) return; el._sig = sig;
  const W = 800, H = 250, L = 46, R = 10, T = 14, B = 28, n = buckets.length;
  const max = niceCeil(Math.max(1, ...buckets.map(b => b.earned)));
  const X = i => L + i*(W-L-R)/(n-1), Y = v => T + (1 - v/max)*(H-T-B);
  let line = `M${X(0)},${Y(buckets[0].earned)}`;
  for (let i = 1; i < n; i++) { const mx = (X(i-1)+X(i))/2; line += ` C${mx},${Y(buckets[i-1].earned)} ${mx},${Y(buckets[i].earned)} ${X(i)},${Y(buckets[i].earned)}`; }
  const area = line + ` L${X(n-1)},${H-B} L${X(0)},${H-B}Z`;
  let grid = '';
  for (let g = 0; g <= 4; g++) { const v = max*g/4, y = Y(v); grid += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L-8}" y="${y+4}" text-anchor="end">${fmtShort(v)}</text>`; }
  const tl = i => new Date(buckets[i].t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  const xl = [0, (n/2)|0, n-1].map((i,k) => `<text x="${X(i)}" y="${H-7}" text-anchor="${k===0?'start':k===2?'end':'middle'}">${tl(i)}</text>`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)} earned over time"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".4"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#g${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${xl}
    <line class="vl" y1="${T}" y2="${H-B}" stroke="var(--mute)" stroke-dasharray="4 4" opacity="0"/><circle class="pt" r="5.5" fill="var(--bg)" stroke="${color}" stroke-width="3" opacity="0"/></svg><div class="tip"></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), vl = svg.querySelector('.vl'), pt = svg.querySelector('.pt');
  el.onmousemove = e => { const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left)/r.width*W;
    const i = Math.max(0, Math.min(n-1, Math.round((px-L)/((W-L-R)/(n-1))))); const x = X(i), y = Y(buckets[i].earned);
    vl.setAttribute('x1',x); vl.setAttribute('x2',x); vl.setAttribute('opacity',1); pt.setAttribute('cx',x); pt.setAttribute('cy',y); pt.setAttribute('opacity',1);
    tip.innerHTML = `${tl(i)}<b>+${fmt(buckets[i].earned)} ${esc(unit)}</b>`; tip.style.left = (x/W*100)+'%'; tip.style.top = (y/H*r.height)+'px'; tip.style.opacity = 1; };
  el.onmouseleave = () => { tip.style.opacity = 0; vl.setAttribute('opacity',0); pt.setAttribute('opacity',0); };
}
function spark(buckets, color){
  if (!buckets || buckets.length < 2) return '';
  const W = 200, H = 46, n = buckets.length, max = Math.max(1, ...buckets.map(b => b.earned));
  const X = i => i*W/(n-1), Y = v => H-4 - v/max*(H-12);
  const pts = buckets.map((b,i) => `${X(i).toFixed(1)},${Y(b.earned).toFixed(1)}`).join(' L');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="sp${color.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".3"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="M${pts} L${W},${H} L0,${H}Z" fill="url(#sp${color.slice(1)})"/><path d="M${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

      if (state.tab !== 'overview') return;
      setNum('#o-mojo', cm.total, v => '+' + fmt(v)); setNum('#o-candy', cc.total, v => '+' + fmt(v));
      $('#o-mojo-l').textContent = $('#o-candy-l').textContent = 'earned in the last ' + RL[state.range];
      $('#o-mojo-r').innerHTML = `<b>${fmt(cm.total/hrs)}</b> / hr avg`; $('#o-candy-r').innerHTML = `<b>${fmt(cc.total/hrs)}</b> / hr avg`;
      chart('#o-mojo-c', cm.buckets, '#a78bfa', 'Mojo', 'om'); chart('#o-candy-c', cc.buckets, '#fbbf24', 'Candy', 'oc');
      $('#sp-mojo').innerHTML = spark(cm.buckets, '#a78bfa'); $('#sp-candy').innerHTML = spark(cc.buckets, '#fbbf24');
      const el = $('#o-list'), list = visible().slice().sort((x,y) => (y.online-x.online)||(y.mojo||0)-(x.mojo||0)).slice(0,6);
      el.innerHTML = list.length ? list.map(x => `<div class="lrow ov ${x.online?'':'off'}" data-acc="${esc(x.user)}">${avatar(x)}<div class="nm"><b>${esc(x.user)}<span class="lvl">Lv ${x.level ?? '?'}</span></b><small>${x.online?(idle(x)?'<span class="badge warn">Idle</span>':'Online'):'Seen '+ago(x.lastSeen)}</small></div><div class="val" style="text-align:left">${fmt(x.mojo)} <small class="u" style="color:var(--mute);font-weight:500">mojo</small></div><div class="val" style="text-align:left">${fmt(x.candy)} <small class="u" style="color:var(--mute);font-weight:500">candy</small></div></div>`).join('') : noAccounts();
      topEarners($('#o-top'));
    } else if (t === 'mojo' || t === 'candy') {
      fillSelect('#h-user', state.chartUser);
      const c = await api(`/api/chart?metric=${t}&range=${state.range}&user=${encodeURIComponent(state.chartUser)}`);
      if (state.tab !== t) return;
      setNum('#h-big', c.total, v => '+' + fmt(v)); $('#h-lbl').textContent = 'earned in the last ' + RL[state.range];
      chart('#h-chart', c.buckets, t === 'mojo' ? '#a78bfa' : '#fbbf24', NAMES[t], 'h');
      const best = A.slice().sort((x,y) => (y[t]||0)-(x[t]||0))[0];
      setNum('#h-total', A.reduce((s,x)=>s+(x[t]||0),0)); $('#h-rate').textContent = fmt(c.total/hrs) + ' / hr'; $('#h-best').textContent = best ? best.user : '—'; setNum('#h-on', on, v => String(Math.round(v)));
      board($('#h-list'), t, visible());
    } else if (t === 'inventory') {
      fillSelect('#invUser', state.invUser);
      const inv = await api('/api/inventory?user=' + encodeURIComponent(state.invUser));
      if (state.tab !== 'inventory') return; drawInv.data = inv.items; drawInv();
    } else if (t === 'accounts') { drawAccounts(); }
    else { if (!state.diag) runDiag(); }
    if (state.drawer) paintDrawer();
  } catch (e) {
    const k = e.kind || 'network';
    setConn({ s: k, detail: e.detail || (k === 'network' ? 'Could not reach the dashboard server.' : String(e.message || e)), hint: e.hint });
    if (k !== 'auth' && k !== 'nokey' && !loaded) { loaded = true; if (state.tab !== 'settings') { setTab('settings', true); return; } }
    if (state.tab === 'settings' && !state.diag) runDiag();
  } finally { busy = false; }
}
function start(){ clearInterval(timer); timer = setInterval(refresh, Math.max(2, state.interval) * 1000); }
function setTab(t, keepDiag){ state.tab = t; ls.set('bb_tab', t); closeDrawer(); if (!keepDiag) state.diag = null; shell(); refresh(true); window.scrollTo(0, 0); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true); });
$('#connBtn').onclick = () => setTab('settings');

async function copyLoader(){
  if (!state.key) { toast('Add your key in Settings first'); setTab('settings'); return; }
  const s = loaderLine(false);
  try { await navigator.clipboard.writeText(s); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(_) {} ta.remove(); }
  toast('Loader copied - run it in your executor');
}
$('#copyLoader').onclick = copyLoader;
buildNav(); shell(); refresh(true); start();
})();
</script>
</body>
