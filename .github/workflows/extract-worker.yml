name: Extract worker archive
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-worker.yml"
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract expected files and remove archive
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          archive = Path("booga-track-worker.zip")
          names = ("worker.js", "wrangler.toml", "README.md")
          if not archive.exists():
              raise SystemExit("booga-track-worker.zip not found")
          with zipfile.ZipFile(archive) as z:
              if z.testzip():
                  raise SystemExit("ZIP integrity check failed")
              available = set(z.namelist())
              missing = [n for n in names if n not in available]
              if missing:
                  raise SystemExit("Missing expected files: " + ", ".join(missing))
              for name in names:
                  Path(name).write_bytes(z.read(name))
          archive.unlink()
          Path(".github/workflows/extract-worker.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract worker files and remove archive"
          git push origin HEAD:main
